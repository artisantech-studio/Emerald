services:
  ledger_db:
    image: postgres:15-alpine
    container_name: artisan_ledger_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Production: Do NOT expose Postgres to host. Internal network only.
    # Uncomment the next two lines only for local debugging:
    # ports:
    #   - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artisan_trust"]
      interval: 3s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    container_name: artisan_gateway
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LEDGER_SECRET: ${LEDGER_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      ledger_db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
